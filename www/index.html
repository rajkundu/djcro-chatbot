<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJCRO Research Assistant</title>
<style>
  :root {
    --blue-dark: #1a4a6e;
    --blue-mid: #2a6496;
    --blue-light: #daeef8;
    --bg: #f8f9fa;
    --bg2: #ffffff;
    --border: #dee2e6;
    --text: #212529;
    --text2: #6c757d;
    --green: #198754;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

  /* ── Header ── */
  #header { background: var(--blue-dark); color: white; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #header .logo { height: 42px; width: auto; background: none; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #header .title { font-size: 15px; font-weight: 600; }
  #header .sub { font-size: 11px; opacity: 0.75; margin-top: 2px; }
  #header .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* ── Stats bar ── */
  #stats { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 6px 20px; display: flex; gap: 20px; flex-shrink: 0; flex-wrap: wrap; }
  .stat { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 4px; }
  .stat strong { color: var(--text); }
  .stat a { color: var(--blue-mid); text-decoration: none; font-size: 12px; }
  .stat a:hover { text-decoration: underline; }

  /* ── Main layout ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar { width: 230px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  #sidebar h3 { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; padding: 12px 14px 6px; border-bottom: 1px solid var(--border); }
  #article-list { overflow-y: auto; flex: 1; }
  .art-item { padding: 8px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.1s; }
  .art-item:hover { background: #f0f6fc; }
  .art-item .art-title { font-size: 11.5px; font-weight: 500; color: var(--text); line-height: 1.4; margin-bottom: 3px; }
  .art-item .art-meta { font-size: 10.5px; color: var(--text2); }
  .topic-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-top: 3px; font-weight: 500; }
  .t-retina { background: #e3f2fd; color: #1565c0; }
  .t-cornea { background: #e8f5e9; color: #2e7d32; }
  .t-glaucoma { background: #fff3e0; color: #e65100; }
  .t-uveitis { background: #fce4ec; color: #880e4f; }
  .t-neuro { background: #f3e5f5; color: #6a1b9a; }
  .t-plastics { background: #e0f2f1; color: #00695c; }
  .t-trauma { background: #fbe9e7; color: #bf360c; }
  .t-peds { background: #e8eaf6; color: #283593; }
  .t-oncology { background: #fffde7; color: #f57f17; }
  .t-other { background: #f5f5f5; color: #555; }

  /* ── Chat ── */
  #chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; gap: 10px; max-width: 88%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .bubble { padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.65; }
  .msg.bot .bubble { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px 12px 12px 12px; }
  .msg.user .bubble { background: var(--blue-dark); color: white; border-radius: 12px 4px 12px 12px; }
  .av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; margin-top: 2px; }
  .msg.bot .av { background: var(--blue-dark); color: white; }
  .msg.user .av { background: #e9ecef; color: var(--text2); border: 1px solid var(--border); }
  .typing span { display: inline-block; width: 6px; height: 6px; background: var(--text2); border-radius: 50%; margin: 0 2px; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  /* ── Suggestions ── */
  #suggestions { padding: 8px 20px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
  .sug { font-size: 11.5px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); color: var(--text2); cursor: pointer; }
  .sug:hover { background: #e9ecef; color: var(--text); }

  /* ── Input ── */
  #input-bar { padding: 10px 20px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; background: var(--bg2); flex-shrink: 0; }
  #inp { flex: 1; padding: 9px 13px; font-size: 13.5px; border: 1px solid var(--border); border-radius: 10px; resize: none; min-height: 40px; max-height: 100px; font-family: inherit; }
  #inp:focus { outline: none; border-color: var(--blue-mid); }
  #send { width: 40px; height: 40px; border-radius: 10px; background: var(--blue-dark); border: none; cursor: pointer; color: white; font-size: 16px; flex-shrink: 0; }
  #send:hover { background: var(--blue-mid); }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Modal ── */
  #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  #modal-overlay.open { display: flex; }
  #modal { background: white; border-radius: 12px; padding: 20px; max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto; }
  #modal h2 { font-size: 15px; margin-bottom: 4px; }
  #modal .meta { font-size: 12px; color: var(--text2); margin-bottom: 12px; }
  #modal .authors { font-size: 13px; margin-bottom: 8px; }
  #modal .link a { font-size: 12px; color: var(--blue-mid); }
  #modal .doi a { font-size: 12px; color: var(--blue-mid); }
  #modal-close { float: right; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text2); margin-top: -4px; }
</style>
</head>

<script>
// ── Secure Backend Proxy URL ─────────────────────────────────────────────────
const WORKER_URL = "https://djcro-chatbot-proxy.rjk368.workers.dev";

let KB = [];
let busy = false;

// ── Topic CSS class mapping ──────────────────────────────────────────────────
function topicClass(t) {
  const l = t.toLowerCase();
  if (l.includes("retina")) return "t-retina";
  if (l.includes("cornea") || l.includes("cataract") || l.includes("refractive")) return "t-cornea";
  if (l.includes("glaucoma")) return "t-glaucoma";
  if (l.includes("uveitis")) return "t-uveitis";
  if (l.includes("neuro")) return "t-neuro";
  if (l.includes("plastic")) return "t-plastics";
  if (l.includes("trauma")) return "t-trauma";
  if (l.includes("pediatric") || l.includes("strabismus")) return "t-peds";
  if (l.includes("oncology")) return "t-oncology";
  return "t-other";
}

// ── Render sidebar ────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById("article-list");
  list.innerHTML = "";
  [...KB].sort((a,b) => b.date.localeCompare(a.date)).forEach(r => {
    const d = document.createElement("div");
    d.className = "art-item";
    
    // Format Sidebar Date strictly as YYYY-MM
    const displayDate = r.date.length >= 7 ? r.date.substring(0, 7) : r.date;
    
    d.innerHTML = `<div class="art-title">${r.title}</div>
      <div class="art-meta">${displayDate} &bull; ${r.volume}</div>
      <span class="topic-badge ${topicClass(r.topic)}">${r.topic}</span>`;
    d.onclick = () => showModal(r);
    list.appendChild(d);
  });
  document.getElementById("art-count").textContent = KB.length;
}

// ── Update stats ─────────────────────────────────────────────────────────────
function updateStats() {
  const auths = new Set();
  const topics = new Set();
  KB.forEach(r => {
    r.authors.forEach(a => auths.add(a));
    if (r.topic && r.topic !== "Other") topics.add(r.topic);
  });
  document.getElementById("st-total").textContent = KB.length;
  document.getElementById("st-auth").textContent = auths.size;
  document.getElementById("st-topics").textContent = topics.size;
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function showModal(r) {
  document.getElementById("modal-content").innerHTML = `
    <span class="topic-badge ${topicClass(r.topic)}" style="font-size:11px">${r.topic}</span>
    <h2 style="margin-top:8px">${r.title}</h2>
    <div class="meta">${r.volume} &bull; Published ${r.date}</div>
    <div class="authors"><strong>Authors:</strong> ${r.authors.join(", ")}</div>
    <div class="link"><strong>Link:</strong> <a href="https://djcro.duke.edu/index.php/djcro/article/view/${r.id}" target="_blank">View Article ↗</a></div>
    <div class="doi"><strong>DOI:</strong> <a href="https://doi.org/${r.doi}" target="_blank">${r.doi} ↗</a></div>
  `;
  document.getElementById("modal-overlay").classList.add("open");
}
function closeModal(e) {
  if (!e || e.target === document.getElementById("modal-overlay")) {
    document.getElementById("modal-overlay").classList.remove("open");
  }
}

// ── Build RAG context ────────────────────────────────────────────────────────
function buildContext(question) {
  const tc = {}, ac = {};
  KB.forEach(r => {
    tc[r.topic] = (tc[r.topic]||0) + 1;
    r.authors.forEach(a => { ac[a.trim()] = (ac[a.trim()]||0) + 1; });
  });
  const topicLine = Object.entries(tc).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`${t}:${c}`).join(" | ");
  const authorLine = Object.entries(ac).sort((a,b)=>b[1]-a[1]).map(([a,c])=>`${a}(${c})`).join(", ");

  const aggRx = /how many|count|total|list|every|all |most|least|prolific|recent|latest|oldest|by author|by topic|published|each author/i;
  const isAgg = aggRx.test(question||"");
  const qWords = (question||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3);

  let pool = [...KB].sort((a,b)=>b.date.localeCompare(a.date));
  if (!isAgg) {
    const scored = pool.map(r => {
      const hay = (r.title+" "+r.authors.join(" ")+" "+r.topic+" "+r.abstract).toLowerCase();
      return { r, s: qWords.reduce((n,w)=>n+(hay.includes(w)?1:0),0) };
    }).sort((a,b)=>b.s-a.s);
    const hits = scored.filter(x=>x.s>0).map(x=>x.r);
    pool = hits.length >= 3 ? hits.slice(0,15) : scored.slice(0,15).map(x=>x.r);
  }

  const lines = pool.map(r=>`${r.date} | ${r.topic} | ${r.authors.join(", ")} | ${r.title} | Abstract: ${r.abstract}`).join("\n");
  const note = pool.length < KB.length ? ` (top ${pool.length} of ${KB.length} by relevance)` : ` (all ${KB.length})`;
  return `DJCRO ${KB.length} reports\nTOPICS: ${topicLine}\nAUTHORS: ${authorLine}\nARTICLES${note}:\n${lines}`;
}

// ── Chat helpers ──────────────────────────────────────────────────────────────
function addBotMsg(html) {
  const d = document.createElement("div");
  d.className = "msg bot";
  d.innerHTML = `<div class="av" style="background:none;border:none;padding:0;overflow:hidden"><img src="data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAMAB4ADASIAAhEBAxEB/8QAHQABAAIDAQEBAQAAAAAAAAAAAAcIBQYJBAMCAf/EAFoQAAEDAwEDBA4GBQcJCAEFAQABAgMEBQYRBwghEjFBkRMWFyI3UVVWYXGBk7LRFHN0obHBFSMyNkIzNFJydYLSJDU4Q1NikrPCGFdjg5Si4fAlREVU4/Gj/8QAGwEBAAIDAQEAAAAAAAAAAAAAAAQGAwUHAQL/xAA7EQEAAQMBAwkHAwUAAwEBAQEAAQIDBBEFFiESMUFRUnGRobEGEzM0U2GBIjLRFELB4fAVI3JDgiTx/9oAMBAAIRAxEAPwCHwAdQcxAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/9k=" alt="DJCRO" style="width:100%;height:100%;object-fit:cover;object-position:center;border-radius:50%" /></div><div class="bubble">${html}</div>`;
  document.getElementById("messages").appendChild(d);
  document.getElementById("messages").scrollTop = 9999;
  return d;
}
function addUserMsg(text) {
  const d = document.createElement("div");
  d.className = "msg user";
  d.innerHTML = `<div class="av">👤</div><div class="bubble">${text.replace(/</g,"&lt;")}</div>`;
  document.getElementById("messages").appendChild(d);
  document.getElementById("messages").scrollTop = 9999;
}
function showTyping() {
  const d = addBotMsg(`<span class="typing"><span></span><span></span><span></span></span>`);
  d.id = "typing";
  return d;
}
function rmTyping() { const t=document.getElementById("typing"); if(t) t.remove(); }

// ── Send message via Worker Proxy ─────────────────────────────────────────────
async function send() {
  if (busy) return;
  const el = document.getElementById("inp");
  const q = el.value.trim();
  if (!q) return;
  el.value = ""; ar(el);
  addUserMsg(q);
  busy = true; document.getElementById("send").disabled = true;
  showTyping();
  const startTime = Date.now();
  
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: `You are a research assistant for the Digital Journal of Case Reports in Ophthalmology (DJCRO), published by Duke Eye Center. Answer questions ONLY using the knowledge base provided. Be concise and cite specific numbers, titles, or author names from the data. If the answer cannot be determined from the data, respond with exactly: "This information is not contained in DJCRO material." Do not speculate.\n\n${buildContext(q)}`,
        messages: [{ role: "user", content: q }]
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || data.error);
    const reply = data.content.filter(b => b.type === "text").map(b => b.text).join("\n");

    // Because caching works near-instantly, simulate response generation delay for consistent UX
    const elapsed = Date.now() - startTime;
    const minDelayMs = 1500; // Set minimum typing time in ms
    if (elapsed < minDelayMs) {
      await new Promise(resolve => setTimeout(resolve, minDelayMs - elapsed));
    }

    rmTyping();
    addBotMsg(reply.replace(/\n/g,"<br>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>"));
  } catch(e) {
    rmTyping();
    addBotMsg(`<span style="color:#dc3545">Error connecting to Server: ${e.message}</span>`);
  }
  busy = false; document.getElementById("send").disabled = false;
}

// ── Master Database Loader ──────────────────────────────────────────────────
async function loadDatabase() {
  if (busy) return;
  
  busy = true; 
  document.getElementById("send").disabled = true;
  document.getElementById("inp").disabled = true;
  const startTime = Date.now();
  showTyping();

  try {
    let dataSource = "Unknown";
    const isTestingOffline = false; // Set to true to test the KV Backup System safely
    const fetchHeaders = { "Content-Type": "application/json" };
    if (isTestingOffline) fetchHeaders["x-simulate-offline"] = "true";

    // 1. Fetch and build the Topics mapping via ListSets
    const setMap = {};
    try {
      const setResponse = await fetch(WORKER_URL, {
        method: "POST", headers: fetchHeaders,
        body: JSON.stringify({ proxy_url: "https://djcro.duke.edu/index.php/djcro/oai?verb=ListSets" })
      });
      if (setResponse.ok) {
        const setText = await setResponse.text();
        const setDoc = new DOMParser().parseFromString(setText, "text/xml");
        const setNodes = setDoc.getElementsByTagName("set");
        for (let i = 0; i < setNodes.length; i++) {
           const spec = setNodes[i].querySelector("setSpec")?.textContent;
           const name = setNodes[i].querySelector("setName")?.textContent;
           if (spec && name) setMap[spec] = name;
        }
      }
    } catch (err) {
      console.warn("Failed to load ListSets mapped topics", err);
    }

    // 2. Fetch the entire Article Database via ListRecords
    let allArticles = [];
    let hasMorePages = true;
    let targetUrl = "https://djcro.duke.edu/index.php/djcro/oai?verb=ListRecords&metadataPrefix=oai_dc";

    while (hasMorePages) {
      const response = await fetch(WORKER_URL, {
        method: "POST", headers: fetchHeaders,
        body: JSON.stringify({ proxy_url: targetUrl }) 
      });

      if (response.headers.has("X-Data-Source")) {
        dataSource = response.headers.get("X-Data-Source");
      }

      if (!response.ok) throw new Error(`Server returned status ${response.status}`);
      
      const xmlText = await response.text();
      const xmlDoc = new DOMParser().parseFromString(xmlText, "text/xml");

      const oaiError = xmlDoc.querySelector("error");
      if (oaiError) {
        if (oaiError.getAttribute("code") === "noRecordsMatch") break;
        throw new Error(oaiError.textContent || oaiError.getAttribute("code"));
      }

      const records = xmlDoc.getElementsByTagName("record");
      for (let i = 0; i < records.length; i++) {
        const metadata = records[i].getElementsByTagName("metadata")[0];
        if (!metadata) continue;

        const dc = metadata.firstElementChild; 
        if (!dc) continue;

        const identifiers = Array.from(dc.getElementsByTagName("dc:identifier")).map(el => el.textContent);
        let id = null;
        let doi = "";
        
        identifiers.forEach(str => {
          if (str.includes("/article/view/")) {
            const parts = str.split("/");
            id = parseInt(parts[parts.length - 1], 10);
          } else if (str.startsWith("10.") || str.includes("doi.org")) {
            doi = str.replace(/.*doi\.org\//, "");
          }
        });

        if (!id) continue;

        const titleEl = dc.getElementsByTagName("dc:title")[0];
        const title = titleEl ? titleEl.textContent : "Untitled Case Report";

        const authors = Array.from(dc.getElementsByTagName("dc:creator")).map(el => el.textContent.trim());

        const dateEl = dc.getElementsByTagName("dc:date")[0];
        const date = dateEl ? dateEl.textContent.trim() : "Unknown Date";

        // Assign Topic precisely from the <setSpec> academic tags instead of <dc:subject>
        let topic = "Other";
        const headerEl = records[i].getElementsByTagName("header")[0];
        if (headerEl) {
          const setSpecs = Array.from(headerEl.getElementsByTagName("setSpec")).map(el => el.textContent);
          const specificSet = setSpecs.find(s => s !== "djcro"); // Filter out the master journal set
          if (specificSet && setMap[specificSet]) {
            topic = setMap[specificSet];
          }
        }

        // --- EXTRACT VOLUME AND SEASON ---
        const sourceEl = dc.getElementsByTagName("dc:source")[0];
        const rawSource = sourceEl ? sourceEl.textContent : "";
        let volumeDisplay = "Recent Publication";

        const seasonMatch = rawSource.match(/(Spring|Summer|Fall|Winter)\s+\d{4}/i);
        const season = seasonMatch ? seasonMatch[0] : "";

        let volNumStr = "";
        const volMatch = rawSource.match(/Vol(?:ume)?\.?\s*(\d+)/i);
        if (volMatch) {
          volNumStr = volMatch[1];
        } else if (doi) {
          // Fallback extraction directly from the DOI structure!
          const doiVolMatch = doi.match(/\.v(\d+)\./i);
          if (doiVolMatch) volNumStr = doiVolMatch[1];
        }

        if (volNumStr && season) {
          volumeDisplay = `Vol. ${volNumStr} (${season})`;
        } else if (season) {
          volumeDisplay = season;
        } else if (volNumStr) {
          volumeDisplay = `Vol. ${volNumStr}`;
        } else if (rawSource) {
          volumeDisplay = rawSource; 
        }

        const volNum = parseInt(volNumStr, 10);

        const descEl = dc.getElementsByTagName("dc:description")[0];
        const abstract = descEl ? descEl.textContent.trim() : "";

        allArticles.push({ id, title, authors, date, topic, volume: volumeDisplay, season, volNum, doi, abstract });
      }

      const tokenEl = xmlDoc.getElementsByTagName("resumptionToken")[0];
      if (tokenEl && tokenEl.textContent.trim()) {
        const token = tokenEl.textContent.trim();
        targetUrl = `https://djcro.duke.edu/index.php/djcro/oai?verb=ListRecords&resumptionToken=${token}`;
      } else {
        hasMorePages = false;
      }
    }

    KB = allArticles;
    
    // 3. Dynamically Calculate Volume Range for Welcome Message using Volume Numbers
    let oldestVol = "";
    let newestVol = "";
    if (KB.length > 0) {
      // Filter out items without a valid volume number, then sort by volume number chronologically
      const sortedByVol = [...KB]
        .filter(a => !isNaN(a.volNum))
        .sort((a, b) => a.volNum - b.volNum);

      if (sortedByVol.length > 0) {
        const oldest = sortedByVol[0];
        const newest = sortedByVol[sortedByVol.length - 1];
        // Display the season in the welcome message/stats (e.g. "Fall 2023")
        oldestVol = oldest.season || oldest.volume;
        newestVol = newest.season || newest.volume;
      } else {
        // Fallback: sort by date if no volume numbers exist
        const sortedByDate = [...KB].sort((a,b) => a.date.localeCompare(b.date));
        oldestVol = sortedByDate[0].season || sortedByDate[0].volume;
        newestVol = sortedByDate[sortedByDate.length - 1].season || sortedByDate[sortedByDate.length - 1].volume;
      }
      
      const rangeText = (oldestVol === newestVol) ? oldestVol : `${oldestVol} \u2013 ${newestVol}`;
      document.getElementById("st-range").textContent = rangeText;
    }
    
    updateStats(); 
    renderSidebar();

    const elapsed = Date.now() - startTime;
    const minDelayMs = 1000;
    if (elapsed < minDelayMs) {
      await new Promise(resolve => setTimeout(resolve, minDelayMs - elapsed));
    }
    rmTyping();
    
    const rangeSentence = (oldestVol && newestVol && oldestVol !== newestVol) 
      ? `indexed from <strong>${oldestVol} through ${newestVol}</strong>`
      : `indexed from <strong>${oldestVol}</strong>`;

    addBotMsg(`Welcome! I have <strong>${KB.length} DJCRO case reports</strong> ${rangeSentence}. <br><br>Click an article in the sidebar to view its details or ask a question to search the library.`);

  } catch (e) {
    rmTyping();
    addBotMsg("<span style=\"color:#dc3545\">Database load failed: " + e.message + "</span>");
  }

  busy = false; 
  document.getElementById("send").disabled = false;
  document.getElementById("inp").disabled = false;
}

function qs(btn) { document.getElementById("inp").value = btn.textContent; send(); }
function hk(e) { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} }
function ar(el) { el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,100)+"px"; }

// ── Init ──────────────────────────────────────────────────────────────────────
loadDatabase();
</script>
